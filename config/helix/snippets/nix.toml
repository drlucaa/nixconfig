[[snippets]]
prefix = "flake"
scope = ["nix"]
description = "Create a basic flake.nix with a devShell"
body = """
{
  description = "Development environment for ${1:# env name}";

  inputs = {
    nixpkgs.url = "github:NixOS/nixpkgs/${2:nixpkgs-unstable}";
    flake-utils.url = "github:numtide/flake-utils";
  };

  outputs =
    {
      nixpkgs,
      flake-utils,
      ...
    }:
    flake-utils.lib.eachDefaultSystem (
      system:
      let
        pkgs = import nixpkgs { inherit system; };
      in
      {
        devShells.default = pkgs.mkShell {
          packages = with pkgs; [
            ${3:# packages}
          ];
        };

        formatter = pkgs.nixfmt-tree;
      }
    );
}"""

[[snippets]]
prefix = "rustflake"
scope = ["nix"]
description = "Create a flake.nix with a rust devShell"
body = """
{
  description = "Development environment for ${1:Rust}";

  inputs = {
    nixpkgs.url = "github:NixOS/nixpkgs/${2:nixpkgs-unstable}";
    flake-utils.url = "github:numtide/flake-utils";
    rust-overlay = {
      url = "github:oxalica/rust-overlay";
      inputs.nixpkgs.follows = "nixpkgs";
    };
  };

  outputs =
    {
      nixpkgs,
      flake-utils,
      rust-overlay,
      ...
    }:
    flake-utils.lib.eachDefaultSystem (
      system:
      let
        pkgs = import nixpkgs {
          inherit system;
          overlays = [
            rust-overlay.overlays.default
          ];
        };

        rustToolchain = pkgs.rust-bin.fromRustupToolchainFile ./rust-toolchain.toml;

        rustPackages = with pkgs; [
          rustToolchain
          cargo-deny
        ];

        
      in
      {
        devShells.default = pkgs.mkShell {
          packages = rustPackages ++ [
            pkgs.just
            pkgs.bacon
          ];

          RUST_BACKTRACE = "1";
        };

        formatter = pkgs.nixfmt-tree;
      }
    );
}"""

